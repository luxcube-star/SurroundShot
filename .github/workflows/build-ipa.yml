name: Build IPA (AltStore)

# 개인 설치용 .ipa 를 만든다 (모아+ 저장소와 같은 방식).
# 서명하지 않은 빌드라 그대로는 설치되지 않고, AltStore/AltServer 가 설치할 때
# 사용자의 Apple 계정으로 다시 서명한다.
# 결과물은 실행 페이지 아래 Artifacts 의 "SurroundShot-ipa" 에서 내려받는다.

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stitch-core-test:
    # 합성 로직(Shared/StitchCore.hpp)을 리눅스에서 실제 사진으로 검사한다 — 빠르고 싸다.
    name: Stitch core test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV
        run: sudo apt-get update -q && sudo apt-get install -y -q libopencv-dev

      - name: Fetch sample photos (opencv_extra/testdata/stitching)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/opencv/opencv_extra.git /tmp/oextra
          git -C /tmp/oextra sparse-checkout set testdata/stitching

      - name: Build and run
        run: |
          g++ -std=c++17 -O2 -Wall tests/stitch_test.cpp -o /tmp/stitch_test $(pkg-config --cflags --libs opencv4)
          mkdir -p /tmp/out
          T=/tmp/oextra/testdata/stitching
          /tmp/stitch_test /tmp/out/boat.jpg cyl $T/boat1.jpg $T/boat2.jpg $T/boat3.jpg $T/boat4.jpg $T/boat5.jpg $T/boat6.jpg
          /tmp/stitch_test /tmp/out/boat_sph.jpg sph $T/boat1.jpg $T/boat2.jpg $T/boat3.jpg $T/boat4.jpg $T/boat5.jpg $T/boat6.jpg
          # 평면: 좁은 3장은 평면 그대로, 넓은 6장은 원통으로 자동 전환돼야 함
          /tmp/stitch_test /tmp/out/boat3_plane.jpg pla $T/boat2.jpg $T/boat3.jpg $T/boat4.jpg | tee /tmp/out/p3.txt
          grep -q "planeFellBack=0" /tmp/out/p3.txt
          /tmp/stitch_test /tmp/out/boat6_plane.jpg pla $T/boat1.jpg $T/boat2.jpg $T/boat3.jpg $T/boat4.jpg $T/boat5.jpg $T/boat6.jpg | tee /tmp/out/p6.txt
          grep -q "planeFellBack=1" /tmp/out/p6.txt
          /tmp/stitch_test /tmp/out/newspaper.jpg cyl $T/newspaper1.jpg $T/newspaper2.jpg $T/newspaper3.jpg $T/newspaper4.jpg

  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages (OpenCV ~200MB)
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('SurroundShot.xcodeproj/project.pbxproj') }}

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project SurroundShot.xcodeproj \
            -scheme SurroundShot \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/SurroundShot.xcarchive \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*(Shared|App|ShareExtension)/|\*\* " || true
          test -d build/SurroundShot.xcarchive/Products/Applications

      - name: Package IPA
        run: |
          APP=$(find build/SurroundShot.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::아카이브에서 .app 을 찾지 못했습니다."
            exit 1
          fi
          if [ ! -d "$APP/PlugIns/ShareExtension.appex" ]; then
            echo "::error::공유 확장(ShareExtension.appex)이 앱 안에 없습니다."
            exit 1
          fi
          # AltStore/AltServer 는 기본 Info.plist 이름으로 App ID 를 등록한다 — 영문·숫자·공백만 허용.
          for bundle in "$APP" "$APP"/PlugIns/*.appex; do
            NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$bundle/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$bundle/Info.plist")
            echo "이름: $bundle → $NAME"
            if ! printf '%s' "$NAME" | grep -Eq '^[A-Za-z0-9 ]+$'; then
              echo "::error::$bundle 의 이름 '$NAME' 에 App ID 로 쓸 수 없는 글자가 있습니다."
              exit 1
            fi
            if [ -f "$bundle/ko.lproj/InfoPlist.strings" ]; then
              echo "한국어 이름:"; plutil -p "$bundle/ko.lproj/InfoPlist.strings"
            else
              echo "::warning::$bundle 에 ko.lproj/InfoPlist.strings 가 없습니다 (한국어 이름이 안 보임)."
            fi
          done
          echo "버전: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::앱 아이콘이 들어가지 않았습니다."
            exit 1
          fi
          echo "앱 아이콘: $(ls "$APP" | grep -i appicon | tr '\n' ' ')"
          echo "공유 확장 설정:"
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$APP/PlugIns/ShareExtension.appex/Info.plist"
          # 합성 엔진(OpenCV stitching + 우리 Objective-C++ 코드)이 두 실행 파일에 실제로 들어갔는지 검사.
          # 릴리스 아카이브는 심볼이 벗겨지므로 문자열로 본다.
          for bin in "$APP/SurroundShot" "$APP/PlugIns/ShareExtension.appex/ShareExtension"; do
            echo "실행 파일: $bin ($(stat -f %z "$bin") bytes)"
            OURS=$(strings "$bin" | grep -c "SSStitchErrorDomain" || true)
            CV=$(strings "$bin" | grep -c "modules/stitching" || true)
            echo "  SSStitchErrorDomain: $OURS, OpenCV stitching 흔적: $CV"
            if [ "$OURS" -eq 0 ] || [ "$CV" -eq 0 ]; then
              echo "::error::$bin 에 합성 엔진이 들어가지 않았습니다."
              exit 1
            fi
          done
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry SurroundShot.ipa Payload
          ls -la SurroundShot.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SurroundShot-ipa
          path: SurroundShot.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7
